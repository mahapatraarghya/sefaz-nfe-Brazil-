[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-sp"
version = "0.1.0"
description = "Emissão de NF-e (modelo 55, layout 4.00) para São Paulo — Simples Nacional"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.9",
    "cryptography>=41",
    "requests>=2.31",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nfe-sp = "nfe_sp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
